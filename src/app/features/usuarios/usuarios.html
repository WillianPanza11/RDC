<!-- header-->
<app-header></app-header>
<div class="card">
    <p-toast />

    <p-table #dt [value]="usuarios" [rows]="10" [paginator]="true" [loading]="cargando"
        [globalFilterFields]="['nombreCompleto', 'username', 'cedula']"
        [tableStyle]="{ 'min-width': '80rem' }" [rowHover]="true" dataKey="idUsuario"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
        [showCurrentPageReport]="true">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h1 class="m-0" style="font-size: 1.5rem; font-weight: 600;">Gestión de Usuarios</h1>
                <div class="flex items-center gap-3">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')"
                            placeholder="Buscar por nombre, usuario o cédula..." />
                    </p-iconfield>
                    <p-button label="Exportar" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
                </div>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th pSortableColumn="nombreCompleto" style="min-width:16rem">
                    <div class="flex items-center gap-2">
                        Nombre Completo
                        <p-sortIcon field="nombreCompleto" />
                    </div>
                </th>
                <th pSortableColumn="username" style="min-width:12rem">
                    <div class="flex items-center gap-2">
                        Usuario
                        <p-sortIcon field="username" />
                    </div>
                </th>
                <th pSortableColumn="cedula" style="min-width:12rem">
                    <div class="flex items-center gap-2">
                        Cédula
                        <p-sortIcon field="cedula" />
                    </div>
                </th>
                <th style="min-width:14rem">Email</th>
                <th style="min-width:18rem">Roles</th>
                <th style="min-width: 10rem">Estado</th>
                <th style="min-width: 12rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-usuario>
            <tr>
                <td>{{ usuario.nombreCompleto }}</td>
                <td>{{ usuario.username }}</td>
                <td>{{ usuario.cedula }}</td>
                <td>{{ usuario.email || '-' }}</td>
                <td>
                    <div class="flex flex-wrap gap-1">
                        <p-tag *ngFor="let rol of usuario.roles" [value]="getRolLabel(rol)"
                            [severity]="getSeverityRol(rol)" />
                    </div>
                </td>
                <td>
                    <p-tag [value]="usuario.enabled ? 'Activo' : 'Inactivo'"
                        [severity]="usuario.enabled ? 'success' : 'secondary'" />
                </td>
                <td>
                    <!-- flex-nowrap: 3 botones en la misma celda no deben partirse en dos líneas (mismo arreglo que en Clientes) -->
                    <div class="flex flex-nowrap items-center gap-2">
                        <p-button icon="pi pi-pencil" size="small" [rounded]="true" [outlined]="true"
                            pTooltip="Editar" (click)="editarUsuario(usuario)" />
                        <p-button *ngIf="usuario.enabled" icon="pi pi-ban" size="small" severity="danger"
                            [rounded]="true" [outlined]="true" pTooltip="Desactivar"
                            (click)="confirmarCambioEstado(usuario)" />
                        <p-button *ngIf="!usuario.enabled" icon="pi pi-check" size="small" severity="success"
                            [rounded]="true" [outlined]="true" pTooltip="Reactivar"
                            (click)="confirmarCambioEstado(usuario)" />
                        <p-button icon="pi pi-key" size="small" severity="warn" [rounded]="true" [outlined]="true"
                            pTooltip="Resetear contraseña" (click)="resetearPassword(usuario)" />
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7" class="text-center p-4">No hay usuarios registrados</td>
            </tr>
        </ng-template>
    </p-table>

    <p-confirmDialog [style]="{ width: '450px' }" />

    <app-editar-usuario-dialog (guardado)="onUsuarioEditado()" />
    <app-resetear-password-dialog />
</div>

<p-dialog [(visible)]="visible" [style]="{ width: '450px' }" header="Resetear Contraseña" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-4">
            <div class="text-sm">
                Nueva contraseña para <strong>{{ nombreUsuario }}</strong>
            </div>

            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-12">
                    <label for="nuevaPassword" class="block font-bold mb-3">Nueva Contraseña *</label>
                    <p-password id="nuevaPassword" [(ngModel)]="nuevaPassword" [toggleMask]="true" [feedback]="true"
                        promptLabel="Ingrese una contraseña" weakLabel="Débil" mediumLabel="Media"
                        strongLabel="Fuerte" styleClass="w-full" inputStyleClass="w-full" fluid />
                    <small class="text-red-500" *ngIf="submitted && !nuevaPassword">La contraseña es
                        requerida.</small>
                    <ng-container *ngIf="submitted && nuevaPassword">
                        <small class="text-red-500 block" *ngFor="let error of erroresPassword">{{ error }}</small>
                    </ng-container>
                </div>

                <div class="col-span-12">
                    <label for="confirmarPassword" class="block font-bold mb-3">Confirmar Contraseña *</label>
                    <p-password id="confirmarPassword" [(ngModel)]="confirmarPassword" [toggleMask]="true"
                        [feedback]="false" styleClass="w-full" inputStyleClass="w-full" fluid />
                    <small class="text-red-500" *ngIf="submitted && !confirmarPassword">Debe confirmar la
                        contraseña.</small>
                    <small class="text-red-500" *ngIf="submitted && confirmarPassword && !passwordsCoinciden">Las
                        contraseñas no coinciden.</small>
                </div>
            </div>
        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Resetear Contraseña" icon="pi pi-key" severity="warn" [loading]="guardando"
            (click)="guardar()" />
    </ng-template>
</p-dialog>

<!-- header -->
<app-header></app-header>
<div class="card">
    <p-toast />

    <p-table #dt [value]="clientesEnMora" [rows]="10" [paginator]="true" [loading]="cargando"
        [globalFilterFields]="['nombreCompleto', 'cedula', 'telefono']"
        [tableStyle]="{ 'min-width': '65rem' }" [rowHover]="true" dataKey="idCliente"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} clientes en mora"
        [showCurrentPageReport]="true">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h1 class="m-0" style="font-size: 1.5rem; font-weight: 600;">Cartera Vencida</h1>
                <div class="flex items-center gap-3">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')"
                            placeholder="Buscar..." />
                    </p-iconfield>
                    <p-button label="Exportar" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
                </div>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th pSortableColumn="nombreCompleto" style="min-width:16rem">
                    <div class="flex items-center gap-2">
                        Nombre
                        <p-sortIcon field="nombreCompleto" />
                    </div>
                </th>
                <th pSortableColumn="cedula" style="min-width:12rem">
                    <div class="flex items-center gap-2">
                        Cédula
                        <p-sortIcon field="cedula" />
                    </div>
                </th>
                <th style="min-width:12rem">Teléfono</th>
                <th pSortableColumn="cantidadCuotasAtrasadas" style="min-width:10rem">
                    <div class="flex items-center gap-2">
                        Cuotas Atrasadas
                        <p-sortIcon field="cantidadCuotasAtrasadas" />
                    </div>
                </th>
                <th pSortableColumn="diasAtrasoMasAntiguo" style="min-width:10rem">
                    <div class="flex items-center gap-2">
                        Días de Atraso
                        <p-sortIcon field="diasAtrasoMasAntiguo" />
                    </div>
                </th>
                <th pSortableColumn="montoTotalAtrasado" style="min-width:12rem">
                    <div class="flex items-center gap-2">
                        Monto Atrasado
                        <p-sortIcon field="montoTotalAtrasado" />
                    </div>
                </th>
                <th style="min-width:8rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-cliente>
            <tr>
                <td>{{ cliente.nombreCompleto }}</td>
                <td>{{ cliente.cedula }}</td>
                <td>
                    <!-- tel: abre el marcador del dispositivo si lo soporta; en un navegador de escritorio sin soporte, simplemente no hace nada -->
                    <a *ngIf="cliente.telefono; else sinTelefono" [href]="'tel:' + cliente.telefono"
                        class="cliente-link">
                        {{ cliente.telefono }}
                    </a>
                    <ng-template #sinTelefono>-</ng-template>
                </td>
                <td>{{ cliente.cantidadCuotasAtrasadas }}</td>
                <td>
                    <p-tag [value]="cliente.diasAtrasoMasAntiguo + ' día(s)'"
                        [severity]="getSeverityDias(cliente.diasAtrasoMasAntiguo)" />
                </td>
                <td>{{ formatCurrency(cliente.montoTotalAtrasado) }}</td>
                <td>
                    <p-button icon="pi pi-eye" [rounded]="true" [outlined]="true" pTooltip="Ver detalle"
                        (click)="verCliente(cliente)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7" class="text-center p-4">No hay clientes en mora.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

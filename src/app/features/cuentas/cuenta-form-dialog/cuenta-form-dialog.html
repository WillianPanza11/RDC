<p-dialog [(visible)]="visible" [style]="{ width: '550px' }" header="Detalles de la Cuenta" [modal]="true">
    <ng-template #content>
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-12">
                <label for="idCliente" class="block font-bold mb-3">Cliente *</label>

                <!-- Cliente ya conocido (viene del hub, o se está editando): campo de solo lectura, sin dropdown -->
                @if (clienteBloqueado) {
                    <input type="text" pInputText [value]="clienteBloqueadoNombre" disabled fluid />
                } @else {
                    <p-select [options]="clientes" [(ngModel)]="cuenta.idCliente" optionLabel="cedula"
                        optionValue="idCliente" placeholder="Seleccione un cliente" class="w-full"
                        [filter]="true"
                        filterBy="cedula,nombres,apellidos"
                        [showClear]="true"
                        [virtualScroll]="clientes.length > 100"
                        appendTo="body"
                        [virtualScrollItemSize]="38">
                        <ng-template let-cliente pTemplate="item">
                            <div>{{ cliente.nombres }} {{ cliente.apellidos }} - {{ cliente.cedula }}</div>
                        </ng-template>
                        <ng-template pTemplate="selectedItem">
                            <div *ngIf="cuenta.idCliente">{{ getClienteNombre(cuenta.idCliente) }}</div>
                        </ng-template>
                    </p-select>
                }
                <small class="text-red-500" *ngIf="submitted && (!cuenta.idCliente || cuenta.idCliente === 0)">El cliente es requerido.</small>
            </div>

            <div class="col-span-12">
                <label for="tipoCuenta" class="block font-bold mb-3">Tipo de Cuenta *</label>
                <p-select [options]="tiposCuenta" [(ngModel)]="cuenta.tipoCuenta" optionLabel="label"
                    optionValue="value" placeholder="Seleccione un tipo" class="w-full" appendTo="body" />
                <small class="text-red-500" *ngIf="submitted && !cuenta.tipoCuenta">El tipo de cuenta es requerido.</small>
            </div>

            <div class="col-span-12 md:col-span-6">
                <label for="saldoActual" class="block font-bold mb-3">Saldo Actual *</label>
                <input type="number" pInputText id="saldoActual" [(ngModel)]="cuenta.saldoActual" required fluid
                    (keypress)="soloNumerosConDecimales($event)"
                    (input)="limpiarSoloNumeros($event)"
                    min="0" step="0.01" />
                <small class="text-red-500" *ngIf="submitted && (cuenta.saldoActual === undefined || cuenta.saldoActual < 0)">El saldo actual es requerido y debe ser mayor o igual a 0.</small>
            </div>

            <div class="col-span-12 md:col-span-6">
                <label for="tasaInteres" class="block font-bold mb-3">Tasa de Interés (%)</label>
                <input type="number" pInputText id="tasaInteres" [(ngModel)]="cuenta.tasaInteres" fluid
                    (keypress)="soloNumerosConDecimales($event)"
                    (input)="limpiarSoloNumeros($event)"
                    min="0" step="0.01" />
            </div>

            <!--Mostrar campo estado solo cuando se va a editar-->
            @if (cuentaId){
            <div class="col-span-12">
                <label for="estado" class="block font-bold mb-3">Estado</label>
                <p-select [options]="estados" [(ngModel)]="selectedEstado" optionLabel="label"
                    optionValue="value" placeholder="Seleccione un estado" class="w-full" appendTo="body" />
            </div>
            }
        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Guardar" icon="pi pi-check" (click)="saveCuenta()" />
    </ng-template>
</p-dialog>
